name: CI and deploy cycling.banas.dev
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check Python and SSH wrapper syntax
        run: |
          python -m compileall -q webapp deployment
          for script in deployment/*.sh; do bash -n "$script"; done
      - name: Test web app and deployment receiver
        run: |
          python -m unittest discover -s webapp/tests -v
          python -m unittest discover -s deployment -v
      - name: Package tested source
        run: python deployment/package.py "$GITHUB_SHA" release.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.sha }}
          path: release.zip
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, cycling-production]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    environment:
      name: production
      url: https://cycling.banas.dev
    concurrency:
      group: cycling-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.sha }}
      - name: Reject stale release and deploy exact tested archive
        run: |
          set -euo pipefail
          live=$(sudo -n /usr/local/sbin/cycling-deploy status)
          if [[ "$live" != "uninitialized" ]]; then
            [[ "$live" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$live" "$GITHUB_SHA"
          fi
          digest=$(sha256sum release.zip | cut -d ' ' -f 1)
          sudo -n /usr/local/sbin/cycling-deploy "$GITHUB_SHA" "$digest" < release.zip
          deployed=$(sudo -n /usr/local/sbin/cycling-deploy status)
          test "$deployed" = "$GITHUB_SHA"
      - name: Verify public health reports the deployed revision
        run: |
          set -euo pipefail
          health=$(curl --fail --silent https://cycling.banas.dev/healthz)
          python3 - "$health" "$GITHUB_SHA" <<'EOF'
          import json, sys
          payload = json.loads(sys.argv[1])
          if payload.get("revision") != sys.argv[2]:
              raise SystemExit("Public health does not report the deployed revision")
          EOF
